services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: eka
      POSTGRES_PASSWORD: eka
      POSTGRES_DB: eka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eka -d eka"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      EKA_ENVIRONMENT: local
      EKA_DATABASE_URL: postgresql://eka:eka@postgres:5432/eka
      EKA_LOG_JSON: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
