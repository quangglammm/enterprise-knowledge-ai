services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: eka
      POSTGRES_PASSWORD: eka
      POSTGRES_DB: eka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eka -d eka"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["eka-migrate"]
    environment:
      EKA_DATABASE_URL: postgresql://eka:eka@postgres:5432/eka
      EKA_LOG_JSON: "true"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      EKA_ENVIRONMENT: local
      EKA_DATABASE_URL: postgresql://eka:eka@postgres:5432/eka
      EKA_LOG_JSON: "true"
    ports:
      - "8000:8000"
    volumes:
      - blobs:/app/data/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Processes ingestion jobs queued by the API (JOB-01). Shares the blob volume until S3.
  worker:
    build: .
    command: ["eka-worker"]
    healthcheck:
      disable: true  # the image's check probes the API port; the worker serves no HTTP
    environment:
      EKA_ENVIRONMENT: local
      EKA_DATABASE_URL: postgresql://eka:eka@postgres:5432/eka
      EKA_LOG_JSON: "true"
    volumes:
      - blobs:/app/data/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  blobs:
