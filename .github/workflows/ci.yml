name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --python 3.12

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src tests

      - name: Architecture contracts
        run: uv run lint-imports

      - name: Unit tests
        run: uv run pytest

  integration:
    name: Integration tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: eka
          POSTGRES_PASSWORD: eka
          POSTGRES_DB: eka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eka -d eka_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      EKA_TEST_DATABASE_URL: postgresql://eka:eka@localhost:5432/eka_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --python 3.12

      - name: Integration and contract tests
        run: uv run pytest -m integration

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Web UI (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
